# The iOS host for Power to the People.
#
# Generated by XcodeGen from this file rather than committed as an .xcodeproj, because a pbxproj
# is unreadable and merges badly. On the Mac, from the project root:
#
#   ~/tools/xcodegen/bin/xcodegen generate --spec iosApp/project.yml
#   open iosApp/PowerToThePeople.xcodeproj
#
# Then Run, or Product > Archive for the App Store. Xcode builds the shared Kotlin code itself
# (see "Build the shared Kotlin code" below). tools/ios-run.sh on Windows does all of this for
# the simulator.
name: PowerToThePeople
options:
  bundleIdPrefix: com.theeclecticwitch
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    # The same team and signing as Rod's other apps.
    DEVELOPMENT_TEAM: 9JTBG6NRXZ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  PowerToThePeople:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Power to the People
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only the system's own HTTPS, so App Store Connect needn't ask on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Compose Multiplatform refuses to start without this, and dies with a bare SIGABRT
        # and no message. It lifts the 60fps cap on 120Hz screens.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The contact buttons open the dialer, mail and the browser.
        LSApplicationQueriesSchemes: [tel, mailto, https]
    preBuildScripts:
      - name: Build the shared Kotlin code
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then BUILD=Release; else BUILD=Debug; fi
          case "$PLATFORM_NAME" in
            iphonesimulator) TARGET=IosSimulatorArm64 ;;
            *) TARGET=IosArm64 ;;
          esac
          # Xcode starts scripts without the login shell's environment, so Java is named here.
          export JAVA_HOME="$HOME/tools/jdk21/Contents/Home"
          cd "$SRCROOT/.."
          ./gradlew ":shared:link${BUILD}Framework${TARGET}" ":shared:assemble${TARGET}MainResources" --console=plain -q
    # Compose Resources - the Constitution and the Caslon fonts - are read from compose-resources/
    # inside the app. This project links the framework directly, so they are copied in here from
    # what Gradle assembled. Without this the app starts with no Constitution and no error at all.
    postBuildScripts:
      - name: Copy Compose resources
        basedOnDependencyAnalysis: false
        script: |
          case "$PLATFORM_NAME" in
            iphonesimulator) SOURCE=iosSimulatorArm64Main ;;
            *) SOURCE=iosArm64Main ;;
          esac
          FROM="$SRCROOT/../shared/build/generated/compose/resourceGenerator/assembledResources/$SOURCE"
          TO="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/compose-resources"
          if [ ! -d "$FROM" ]; then
            echo "error: $FROM is missing"
            exit 1
          fi
          rm -rf "$TO"
          mkdir -p "$TO"
          cp -R "$FROM/" "$TO/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.theeclecticwitch.powertothepeople
        SWIFT_VERSION: "5.0"
        # iPhone and iPad: the layout adapts, switching to a side rail on wide screens.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Gradle step reads and writes outside the Xcode project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        KOTLIN_TARGET[sdk=iphonesimulator*]: iosSimulatorArm64
        KOTLIN_TARGET[sdk=iphoneos*]: iosArm64
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/bin/$(KOTLIN_TARGET)/$(KOTLIN_BUILD)Framework
        OTHER_LDFLAGS: [-framework, PowerToThePeopleKit]
      configs:
        Debug:
          KOTLIN_BUILD: debug
        Release:
          KOTLIN_BUILD: release

# Spelled out: Xcode only invents a scheme for a project nobody has opened yet, and once it had
# been opened, xcodebuild found none on MyWorkTracker.
schemes:
  PowerToThePeople:
    build:
      targets:
        PowerToThePeople: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
