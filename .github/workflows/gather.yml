# Gathers bills and votes every six hours and publishes them to GitHub Pages (the gh-pages branch),
# where the app downloads them. Also runs on demand: Actions tab > Gather data > Run workflow.
# Each run commits only the files that changed, so gh-pages history is a public record of every update.
name: Gather data

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gather
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Get the data published so far
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Libraries beyond Python's own: Open States keeps its state officials in YAML files, and the weekly
      # This Week in Congress briefing is read aloud by Piper and saved as an MP3.
      - name: Install the YAML reader and the briefing voice
        run: pip install pyyaml==6.0.3 piper-tts==1.8.0 lameenc==1.8.4

      # The voice "Norman" (public domain, LibriVox recordings), kept between runs so it downloads once.
      - name: Keep the voice between runs
        uses: actions/cache@v6
        with:
          path: voices
          key: piper-en_US-norman-medium

      - name: Get the voice
        run: |
          mkdir -p voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/norman/medium
          for f in en_US-norman-medium.onnx en_US-norman-medium.onnx.json; do
            [ -s voices/$f ] || curl -sfL --retry 5 -o voices/$f $base/$f || echo "Couldn't get $f; the briefing will have no audio this run."
          done

      - name: Gather
        env:
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
          PIPER_VOICE: voices/en_US-norman-medium.onnx
        run: python tools/gather/gather.py --out site

      # Runs even when a source failed, so whatever did arrive is still published.
      - name: Publish
        if: ${{ !cancelled() }}
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit --quiet -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
